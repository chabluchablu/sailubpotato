<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dek70 Planner - ปฏิทินกิจกรรม</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Sarabun', sans-serif; background-color: #b991bf; color: #333; display: flex; min-height: 100vh; }
        
        aside { 
            width: 240px; 
            min-width: 240px;
            background-color: #ffffff; 
            box-shadow: 2px 0 10px rgba(0,0,0,0.1); 
            position: fixed; 
            top: 0; 
            left: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            padding: 20px; 
            z-index: 1000; 
        }
        .sidebar-header { text-align: center; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .sidebar-header h1 { font-size: 20px; color: #b991bf; font-weight: 700; }
        .sidebar-header p { font-size: 11px; color: #666; margin-top: 4px; }
        nav { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .nav-btn { 
            width: 100%; 
            padding: 12px 14px; 
            text-align: left; 
            background: none; 
            border: none; 
            border-radius: 12px; 
            font-family: 'Sarabun', sans-serif; 
            font-size: 14px; 
            font-weight: 500; 
            color: #555; 
            cursor: pointer; 
            text-decoration: none; 
            display: block; 
        }
        .nav-btn:hover { background-color: #f0f0f0; }
        .nav-btn.active { background-color: #b991bf; color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .sidebar-footer { font-size: 11px; color: #888; text-align: center; }

        main { margin-left: 240px; flex: 1; padding: 30px; max-width: 900px; }
        .page-title { text-align: center; font-size: 44px; font-weight: bold; color: #f2e479; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); margin-bottom: 25px; }
        .card { background-color: #ffffff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .card h3 { font-size: 17px; font-weight: bold; color: #333; margin-bottom: 15px; }
        
        .event-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; background-color: #faf5fc; border: 1px solid #f0e1f5; border-radius: 10px; margin-bottom: 10px; }
        .event-item.completed { background-color: #f9f9f9; border-color: #eee; opacity: 0.6; text-decoration: line-through; }
        .event-left { display: flex; align-items: center; gap: 12px; }
        .event-left input[type="checkbox"] { width: 18px; height: 18px; accent-color: #b991bf; cursor: pointer; }
        .del-btn { background: none; border: none; color: #aaa; cursor: pointer; font-size: 12px; }
        .del-btn:hover { color: #ff4d4d; }
        
        .form-group { display: grid; grid-template-columns: 2fr 1.5fr 1fr; gap: 10px; margin-top: 15px; }
        .form-group input { padding: 10px 14px; border: 1px solid #ddd; border-radius: 10px; font-family: 'Sarabun', sans-serif; font-size: 14px; outline: none; }
        .submit-btn { background-color: #b991bf; color: white; border: none; border-radius: 10px; font-family: 'Sarabun', sans-serif; font-weight: 600; cursor: pointer; }
        .submit-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <aside>
        <div>
            <div class="sidebar-header">
                <h1>DEK 70 PLANNER</h1>
                <p>สู้ไปด้วยกันนะว่าที่คุณหมอ/เภสัช!</p>
            </div>
            <nav>
                <a href="index.html" class="nav-btn">🏠 หน้าแรก</a>
                <a href="calendar.html" class="nav-btn active">📅 ปฏิทินและกิจกรรม</a>
                <a href="info.html" class="nav-btn">💊 ข้อมูลคณะและคะแนน</a>
                <a href="files.html" class="nav-btn">📚 หนังสือและไฟล์เรียน</a>
            </nav>
        </div>
        <div class="sidebar-footer">Target: DEK 70 Admission</div>
    </aside>

    <main>
        <h2 class="page-title">ปฏิทินกิจกรรม</h2>

        <div class="card">
            <h3>ไทม์ไลม์กำหนดการเตรียมตัวสอบ</h3>
            <div id="event-list"></div>

            <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
                <h4 style="font-size: 14px; font-weight: bold; color: #444; margin-bottom: 10px;">➕ เพิ่มกิจกรรมหรือกำหนดการใหม่</h4>
                <form id="add-event-form" onsubmit="addNewEvent(event)" class="form-group">
                    <input type="text" id="event-name" placeholder="ชื่อกิจกรรม (เช่น สอบกลางภาค)" required>
                    <input type="date" id="event-date" required>
                    <button type="submit" class="submit-btn">+ บันทึก</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        let defaultEvents = [
            { name: "Mock TGAT", date: "2026-10-31", completed: false },
            { name: "Mock TPAT 1", date: "2026-11-01", completed: false },
            { name: "สมัคร TGAT", date: "2026-11-04", completed: false },
            { name: "สอบ TGAT", date: "2027-01-30", completed: false },
            { name: "สอบ TPAT 1", date: "2027-02-13", completed: false },
            { name: "สอบ A-LEVEL", date: "2027-03-13", completed: false }
        ];

        let events = JSON.parse(localStorage.getItem('dek70_events')) || defaultEvents;

        function renderEvents() {
            events.sort((a, b) => new Date(a.date) - new Date(b.date));
            localStorage.setItem('dek70_events', JSON.stringify(events));

            const listEl = document.getElementById('event-list');
            listEl.innerHTML = '';

            events.forEach((ev, index) => {
                let parts = ev.date.split('-');
                let evDate = new Date(parts[0], parts[1] - 1, parts[2]);
                let options = { year: 'numeric', month: 'short', day: 'numeric' };
                let formattedDate = evDate.toLocaleDateString('th-TH', options);

                let itemHTML = `
                    <div class="event-item ${ev.completed ? 'completed' : ''}">
                        <div class="event-left">
                            <input type="checkbox" ${ev.completed ? 'checked' : ''} onclick="toggleEvent(${index})">
                            <div>
                                <p style="font-weight:600; font-size:14px;">${ev.name}</p>
                                <p style="font-size:11px; color:#666;">${formattedDate}</p>
                            </div>
                        </div>
                        <button onclick="deleteEvent(${index})" class="del-btn">ลบ</button>
                    </div>
                `;
                listEl.innerHTML += itemHTML;
            });
        }

        function addNewEvent(e) {
            e.preventDefault();
            const name = document.getElementById('event-name').value;
            const date = document.getElementById('event-date').value;

            if (name && date) {
                events.push({ name, date, completed: false });
                document.getElementById('event-name').value = '';
                document.getElementById('event-date').value = '';
                renderEvents();
            }
        }

        function toggleEvent(index) {
            events[index].completed = !events[index].completed;
            renderEvents();
        }

        function deleteEvent(index) {
            events.splice(index, 1);
            renderEvents();
        }

        renderEvents();
    </script>
</body>
</html>
