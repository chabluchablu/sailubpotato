<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dek70 Planner - ปฏิทินกิจกรรม</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Sarabun', sans-serif; 
            background: linear-gradient(135deg, #b991bf 0%, #a476ab 100%); 
            color: #333; 
            min-height: 100vh; 
            padding: 20px 20px 100px 20px; 
            display: flex;
            justify-content: center;
        }
        
        aside { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
            background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); border-radius: 40px; 
            display: flex; align-items: center; padding: 8px 15px; z-index: 9999; border: 2px solid #f3e8f4;
        }
        nav { display: flex; gap: 12px; align-items: center; }
        
        .nav-btn { 
            width: 45px; height: 45px; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; font-size: 20px; 
            color: #666; text-decoration: none; transition: all 0.25s ease; 
            position: relative; background-color: #fcf8fd;
        }
        .nav-btn:hover { background-color: #f0e1f5; transform: translateY(-3px); }
        .nav-btn.active { background: linear-gradient(135deg, #b991bf, #9d6fa3); color: white; box-shadow: 0 4px 12px rgba(185, 145, 191, 0.5); }

        .nav-btn::after {
            content: attr(data-title); position: absolute; bottom: 55px; left: 50%; 
            transform: translateX(-50%); background-color: #4a3e4e; color: white; padding: 4px 10px; 
            border-radius: 8px; font-size: 11px; font-weight: 600; white-space: nowrap; 
            opacity: 0; pointer-events: none; transition: opacity 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .nav-btn:hover::after { opacity: 1; }

        main { width: 100%; max-width: 900px; }
        .page-title-container { text-align: center; margin-bottom: 25px; }
        .page-title { 
            display: inline-block;
            font-size: 52px; font-weight: 800; color: #f2e479; 
            text-shadow: 2px 4px 8px rgba(0,0,0,0.25); letter-spacing: 2px;
            background: rgba(0,0,0,0.05); padding: 5px 30px; border-radius: 20px;
        }
        
        .card { 
            background-color: #ffffff; border-radius: 20px; padding: 24px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.08); margin-bottom: 20px; 
            border-left: 6px solid #b991bf;
        }
        .card h3 { font-size: 18px; font-weight: 700; color: #4a3e4e; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        
        .event-item { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 14px 18px; background-color: #fdf8fe; border: 1.5px solid #f2e3f5; 
            border-radius: 14px; margin-bottom: 12px; transition: all 0.2s;
        }
        .event-item:hover { border-color: #b991bf; background-color: #faf0fc; }
        .event-item.completed { background-color: #f8f8f8; border-color: #eee; opacity: 0.55; text-decoration: line-through; }
        .event-left { display: flex; align-items: center; gap: 14px; }
        .event-left input[type="checkbox"] { width: 20px; height: 20px; accent-color: #8e5296; cursor: pointer; }
        .del-btn { background: #ffeef0; border: none; color: #e53e3e; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .del-btn:hover { background: #fed7d7; }
        
        .form-group { display: grid; grid-template-columns: 2fr 1.5fr 1fr; gap: 12px; margin-top: 15px; }
        .form-group input { padding: 12px 16px; border: 1.5px solid #e2d2e5; border-radius: 12px; font-family: 'Sarabun', sans-serif; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #8e5296; box-shadow: 0 0 0 3px rgba(142, 82, 150, 0.15); }
        .submit-btn { background: linear-gradient(135deg, #b991bf, #9d6fa3); color: white; border: none; border-radius: 12px; font-family: 'Sarabun', sans-serif; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
        .submit-btn:hover { opacity: 0.9; }

        .sync-status { font-size: 12px; font-weight: 500; color: #666; }

        @media(max-width: 600px) {
            .form-group { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <aside>
        <nav>
            <a href="index.html" class="nav-btn" data-title="หน้าแรก">🏠</a>
            <a href="calendar.html" class="nav-btn active" data-title="ปฏิทินและกิจกรรม">📅</a>
            <a href="info.html" class="nav-btn" data-title="ข้อมูลคณะและคะแนน">💊</a>
            <a href="files.html" class="nav-btn" data-title="หนังสือและไฟล์เรียน">📚</a>
        </nav>
    </aside>

    <main>
        <div class="page-title-container">
            <h2 class="page-title">ปฏิทินกิจกรรม</h2>
        </div>

        <div class="card">
            <h3>
                <span>📌 ไทม์ไลน์กำหนดการเตรียมตัวสอบ</span>
                <span id="sync-text" class="sync-status">☁️ เชื่อมต่อคลาวด์แล้ว</span>
            </h3>
            <div id="event-list">กำลังโหลดข้อมูลจากคลาวด์...</div>

            <div style="margin-top: 25px; border-top: 2px dashed #f0e1f5; padding-top: 20px;">
                <h4 style="font-size: 15px; font-weight: 700; color: #5a455e; margin-bottom: 12px;">➕ เพิ่มกิจกรรมหรือกำหนดการใหม่</h4>
                <form id="add-event-form" onsubmit="addNewEvent(event)" class="form-group">
                    <input type="text" id="event-name" placeholder="ชื่อกิจกรรม (เช่น สอบกลางภาค)" required>
                    <input type="date" id="event-date" required>
                    <button type="submit" class="submit-btn">+ บันทึก</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        // ใช้ระบบคลาวด์ส่วนกลางสำหรับซิงค์ข้อมูล
        const BIN_ID = "67905fbcad19ca34f8e02d84"; // รหัสคลาวด์ส่วนตัวของคุณ
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
        
        let defaultEvents = [
            { name: "Mock TGAT", date: "2026-10-31", completed: false },
            { name: "Mock TPAT 1", date: "2026-11-01", completed: false },
            { name: "สมัคร TGAT", date: "2026-11-04", completed: false },
            { name: "สอบ TGAT", date: "2027-01-30", completed: false },
            { name: "สอบ TPAT 1", date: "2027-02-13", completed: false },
            { name: "สอบ A-LEVEL", date: "2027-03-13", completed: false }
        ];

        let events = [];

        // โหลดข้อมูลจากคลาวด์
        async function fetchEvents() {
            try {
                let response = await fetch(API_URL + "/latest", {
                    headers: { "X-Master-Key": "$2a$10$7v2t5Lg... (public free bin)" } // ใช้โหมดอ่านสาธารณะ
                });
                // หากดึงไม่ได้ ให้ใช้ LocalStorage สำรอง
                let data = await response.json();
                events = data.record || defaultEvents;
            } catch (err) {
                events = JSON.parse(localStorage.getItem('dek70_events')) || defaultEvents;
            }
            renderEvents();
        }

        // บันทึกข้อมูลขึ้นคลาวด์
        async function saveEvents() {
            localStorage.setItem('dek70_events', JSON.stringify(events));
            document.getElementById('sync-text').innerText = "⏳ กำลังซิงค์...";
            
            try {
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify(events)
                });
                document.getElementById('sync-text').innerText = "☁️ ซิงค์ข้อมูลสำเร็จ";
            } catch (err) {
                document.getElementById('sync-text').innerText = "⚠️ บันทึกในเครื่อง (ออฟไลน์)";
            }
        }

        function renderEvents() {
            events.sort((a, b) => new Date(a.date) - new Date(b.date));
            const listEl = document.getElementById('event-list');
            listEl.innerHTML = '';

            events.forEach((ev, index) => {
                let parts = ev.date.split('-');
                let evDate = new Date(parts[0], parts[1] - 1, parts[2]);
                let options = { year: 'numeric', month: 'short', day: 'numeric' };
                let formattedDate = evDate.toLocaleDateString('th-TH', options);

                let itemHTML = `
                    <div class="event-item ${ev.completed ? 'completed' : ''}">
                        <div class="event-left">
                            <input type="checkbox" ${ev.completed ? 'checked' : ''} onclick="toggleEvent(${index})">
                            <div>
                                <p style="font-weight:700; font-size:14.5px; color:#4a3e4e;">${ev.name}</p>
                                <p style="font-size:11.5px; color:#888;">📅 ${formattedDate}</p>
                            </div>
                        </div>
                        <button onclick="deleteEvent(${index})" class="del-btn">ลบ</button>
                    </div>
                `;
                listEl.innerHTML += itemHTML;
            });
        }

        function addNewEvent(e) {
            e.preventDefault();
            const name = document.getElementById('event-name').value;
            const date = document.getElementById('event-date').value;

            if (name && date) {
                events.push({ name, date, completed: false });
                document.getElementById('event-name').value = '';
                document.getElementById('event-date').value = '';
                saveEvents();
                renderEvents();
            }
        }

        function toggleEvent(index) {
            events[index].completed = !events[index].completed;
            saveEvents();
            renderEvents();
        }

        function deleteEvent(index) {
            events.splice(index, 1);
            saveEvents();
            renderEvents();
        }

        fetchEvents();
    </script>
</body>
</html>
