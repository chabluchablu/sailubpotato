<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dek70 Planner - ปฏิทินกิจกรรม</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Sarabun', sans-serif; background-color: #b991bf; color: #333; display: flex; min-height: 100vh; padding: 20px; }
        
        aside { 
            width: 220px; min-width: 220px; background-color: #ffffff; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.12); position: fixed; 
            top: 20px; left: 20px; bottom: 20px; border-radius: 24px;
            display: flex; flex-direction: column; justify-content: space-between; 
            padding: 24px 16px; z-index: 1000; border: 2px solid #f3e8f4;
        }
        .sidebar-header { text-align: center; padding-bottom: 15px; border-bottom: 2px dashed #f0e1f5; }
        .sidebar-header h1 { font-size: 19px; color: #8e5296; font-weight: 700; }
        .sidebar-header p { font-size: 11px; color: #888; margin-top: 3px; }
        nav { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .nav-btn { 
            width: 100%; padding: 12px 14px; text-align: left; background: none; 
            border: none; border-radius: 14px; font-family: 'Sarabun', sans-serif; 
            font-size: 13.5px; font-weight: 600; color: #666; cursor: pointer; 
            transition: all 0.25s ease; text-decoration: none; display: flex; align-items: center; gap: 8px;
        }
        .nav-btn:hover { background-color: #f7eef9; color: #8e5296; transform: translateX(3px); }
        .nav-btn.active { background: linear-gradient(135deg, #b991bf, #9d6fa3); color: white; box-shadow: 0 4px 12px rgba(185, 145, 191, 0.4); }
        .sidebar-footer { font-size: 10.5px; color: #aaa; text-align: center; font-weight: 500; }

        main { margin-left: 255px; flex: 1; padding: 10px 20px; max-width: 900px; }
        .page-title { text-align: center; font-size: 48px; font-weight: 800; color: #f2e479; text-shadow: 2px 3px 6px rgba(0,0,0,0.25); margin-bottom: 25px; }
        
        .card { 
            background-color: #ffffff; border-radius: 20px; padding: 24px; 
            box-shadow: 0 6px 18px rgba(0,0,0,0.06); margin-bottom: 20px; 
            border-left: 5px solid #b991bf;
        }
        .card h3 { font-size: 18px; font-weight: 700; color: #4a3e4e; margin-bottom: 16px; }
        
        .event-item { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 14px 18px; background-color: #fdf8fe; border: 1.5px solid #f2e3f5; 
            border-radius: 14px; margin-bottom: 12px; transition: all 0.2s;
        }
        .event-item:hover { border-color: #b991bf; background-color: #faf0fc; }
        .event-item.completed { background-color: #f8f8f8; border-color: #eee; opacity: 0.55; text-decoration: line-through; }
        .event-left { display: flex; align-items: center; gap: 14px; }
        .event-left input[type="checkbox"] { width: 20px; height: 20px; accent-color: #8e5296; cursor: pointer; }
        .del-btn { background: #ffeef0; border: none; color: #e53e3e; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .del-btn:hover { background: #fed7d7; }
        
        .form-group { display: grid; grid-template-columns: 2fr 1.5fr 1fr; gap: 12px; margin-top: 15px; }
        .form-group input { padding: 12px 16px; border: 1.5px solid #e2d2e5; border-radius: 12px; font-family: 'Sarabun', sans-serif; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #8e5296; box-shadow: 0 0 0 3px rgba(142, 82, 150, 0.15); }
        .submit-btn { background: linear-gradient(135deg, #b991bf, #9d6fa3); color: white; border: none; border-radius: 12px; font-family: 'Sarabun', sans-serif; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
        .submit-btn:hover { opacity: 0.9; }

        @media(max-width: 768px) {
            body { flex-direction: column; padding: 10px; }
            aside { position: relative; width: 100%; min-width: 100%; height: auto; top: 0; left: 0; bottom: 0; margin-bottom: 15px; }
            main { margin-left: 0; padding: 0; }
            .form-group { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <aside>
        <div>
            <div class="sidebar-header">
                <h1>✨ DEK 70 PLANNER</h1>
                <p>สู้ไปด้วยกันนะว่าที่คุณหมอ/เภสัช! 💊💙</p>
            </div>
            <nav>
                <a href="index.html" class="nav-btn"><span>🏠</span> หน้าแรก</a>
                <a href="calendar.html" class="nav-btn active"><span>📅</span> ปฏิทินและกิจกรรม</a>
                <a href="info.html" class="nav-btn"><span>💊</span> ข้อมูลคณะและคะแนน</a>
                <a href="files.html" class="nav-btn"><span>📚</span> หนังสือและไฟล์เรียน</a>
            </nav>
        </div>
        <div class="sidebar-footer">🎯 Target: DEK 70 Admission</div>
    </aside>

    <main>
        <h2 class="page-title">ปฏิทินกิจกรรม</h2>

        <div class="card">
            <h3>📌 ไทม์ไลน์กำหนดการเตรียมตัวสอบ</h3>
            <div id="event-list"></div>

            <div style="margin-top: 25px; border-top: 2px dashed #f0e1f5; padding-top: 20px;">
                <h4 style="font-size: 15px; font-weight: 700; color: #5a455e; margin-bottom: 12px;">➕ เพิ่มกิจกรรมหรือกำหนดการใหม่</h4>
                <form id="add-event-form" onsubmit="addNewEvent(event)" class="form-group">
                    <input type="text" id="event-name" placeholder="ชื่อกิจกรรม (เช่น สอบกลางภาค)" required>
                    <input type="date" id="event-date" required>
                    <button type="submit" class="submit-btn">+ บันทึก</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        let defaultEvents = [
            { name: "Mock TGAT", date: "2026-10-31", completed: false },
            { name: "Mock TPAT 1", date: "2026-11-01", completed: false },
            { name: "สมัคร TGAT", date: "2026-11-04", completed: false },
            { name: "สอบ TGAT", date: "2027-01-30", completed: false },
            { name: "สอบ TPAT 1", date: "2027-02-13", completed: false },
            { name: "สอบ A-LEVEL", date: "2027-03-13", completed: false }
        ];

        let events = JSON.parse(localStorage.getItem('dek70_events')) || defaultEvents;

        function renderEvents() {
            events.sort((a, b) => new Date(a.date) - new Date(b.date));
            localStorage.setItem('dek70_events', JSON.stringify(events));

            const listEl = document.getElementById('event-list');
            listEl.innerHTML = '';

            events.forEach((ev, index) => {
                let parts = ev.date.split('-');
                let evDate = new Date(parts[0], parts[1] - 1, parts[2]);
                let options = { year: 'numeric', month: 'short', day: 'numeric' };
                let formattedDate = evDate.toLocaleDateString('th-TH', options);

                let itemHTML = `
                    <div class="event-item ${ev.completed ? 'completed' : ''}">
                        <div class="event-left">
                            <input type="checkbox" ${ev.completed ? 'checked' : ''} onclick="toggleEvent(${index})">
                            <div>
                                <p style="font-weight:700; font-size:14.5px; color:#4a3e4e;">${ev.name}</p>
                                <p style="font-size:11.5px; color:#888;">📅 ${formattedDate}</p>
                            </div>
                        </div>
                        <button onclick="deleteEvent(${index})" class="del-btn">ลบ</button>
                    </div>
                `;
                listEl.innerHTML += itemHTML;
            });
        }

        function addNewEvent(e) {
            e.preventDefault();
            const name = document.getElementById('event-name').value;
            const date = document.getElementById('event-date').value;

            if (name && date) {
                events.push({ name, date, completed: false });
                document.getElementById('event-name').value = '';
                document.getElementById('event-date').value = '';
                renderEvents();
            }
        }

        function toggleEvent(index) {
            events[index].completed = !events[index].completed;
            renderEvents();
        }

        function deleteEvent(index) {
            events.splice(index, 1);
            renderEvents();
        }

        renderEvents();
    </script>
</body>
</html>
